<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Échecs — jouer en ligne, contre l'ordinateur ou à deux</title>
  <meta name="description" content="Jeu d'échecs gratuit dans le navigateur : toutes les règles, partie contre l'ordinateur, en ligne avec un ami par simple lien, ou à deux sur le même écran. Fonctionne hors ligne.">
  <meta name="theme-color" content="#12162a">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Échecs">
  <meta property="og:description" content="Jouez aux échecs en ligne avec un ami, contre l'ordinateur ou à deux.">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/engine.js">
  <link rel="modulepreload" href="js/online.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="header">
    <h1>♞ Échecs</h1>
  </header>

  <main class="layout">
    <section class="board-area" aria-label="Plateau">
      <div class="player">
        <span class="player-name" id="top-name">Noirs</span>
        <span class="captured" id="top-captured"></span>
      </div>
      <div class="board" id="board" role="grid" aria-label="Échiquier"></div>
      <div class="player">
        <span class="player-name" id="bottom-name">Blancs</span>
        <span class="captured" id="bottom-captured"></span>
      </div>
    </section>

    <aside class="panel">
      <p class="status" id="status" role="status" aria-live="polite">Chargement…</p>

      <div class="card">
        <label class="field">
          <span>Mode</span>
          <select id="mode">
            <option value="local">À deux (même écran)</option>
            <option value="ai">Contre l'ordinateur</option>
            <option value="online">En ligne avec un ami</option>
          </select>
        </label>

        <div class="options" id="ai-options" hidden>
          <label class="field">
            <span>Niveau</span>
            <select id="level">
              <option value="facile">Facile</option>
              <option value="moyen">Moyen</option>
              <option value="difficile">Difficile</option>
            </select>
          </label>
          <label class="field">
            <span>Vous jouez</span>
            <select id="color">
              <option value="w">Les blancs</option>
              <option value="b">Les noirs</option>
              <option value="random">Au hasard</option>
            </select>
          </label>
        </div>

        <div class="options" id="online-options" hidden>
          <button class="btn" id="online-create" type="button">Créer une partie</button>
          <div class="link-row" id="online-link" hidden>
            <input type="text" id="online-url" readonly aria-label="Lien d'invitation">
            <button class="btn" id="online-copy" type="button">Partager</button>
          </div>
          <p class="hint" id="online-status">Créez une partie puis envoyez le lien à votre adversaire.</p>
        </div>

        <button class="btn primary" id="new-game" type="button">Nouvelle partie</button>
      </div>

      <div class="card">
        <h2>Coups</h2>
        <ol class="moves" id="moves" aria-label="Historique des coups"></ol>
      </div>

      <div class="actions">
        <button class="btn" id="undo" type="button" title="Ctrl+Z">Annuler le coup</button>
        <button class="btn" id="flip" type="button">Retourner</button>
        <button class="btn" id="pgn" type="button">Copier le PGN</button>
        <button class="btn" id="resign" type="button" hidden>Abandonner</button>
      </div>
    </aside>
  </main>

  <dialog id="promotion" aria-label="Promotion du pion">
    <form method="dialog">
      <h2>Promotion</h2>
      <p>Choisissez la nouvelle pièce.</p>
      <div class="promotion-choices">
        <button value="q" aria-label="Dame"><span class="piece w">♛&#xFE0E;</span></button>
        <button value="r" aria-label="Tour"><span class="piece w">♜&#xFE0E;</span></button>
        <button value="b" aria-label="Fou"><span class="piece w">♝&#xFE0E;</span></button>
        <button value="n" aria-label="Cavalier"><span class="piece w">♞&#xFE0E;</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="result">
    <form method="dialog">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <div class="dialog-actions">
        <button class="btn primary" id="rematch" type="button">Rejouer</button>
        <button class="btn" value="close">Fermer</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Ce jeu nécessite JavaScript.</p></noscript>
</body>
</html>
